<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>无限画布</title>
    <!-- Markdown 渲染器（marked，MIT，内嵌不联网） -->
    <script src="/vendor/marked.umd.js"></script>
    <!-- DOCX 预览（mammoth，BSD，内嵌不联网）：把 docx 转成语义化 HTML -->
    <script src="/vendor/mammoth/mammoth.browser.min.js"></script>
    <!-- XLSX 预览（SheetJS xlsx@0.18.5，MIT，内嵌不联网）：把表格读成数据再自己画成表 -->
    <script src="/vendor/xlsx/xlsx.full.min.js"></script>
    <!-- PPTX 预览（JSZip 3.10.1，MIT，内嵌不联网）：解 OOXML 压缩包读 slide XML 与图片 -->
    <script src="/vendor/jszip/jszip.min.js"></script>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>

    <div class="shell">
      <section class="canvas-page" id="canvas-view">
        <aside class="space-tree" id="space-tree" aria-label="画布管理">
          <div class="space-tree-body" id="space-tree-body"></div>
          <div class="space-tree-resize" id="space-tree-resize" aria-hidden="true"></div>
        </aside>
        <div class="canvas-main">
          <header class="titlebar" data-tauri-drag-region>
            <button
              class="titlebar-side-toggle"
              id="space-tree-hide"
              type="button"
              title="收起画布栏"
              aria-label="收起画布栏"
            >
              <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
                <rect x="2" y="3.2" width="12" height="9.6" rx="1.8" stroke="currentColor" stroke-width="1.4" fill="none" />
                <rect class="titlebar-side-bar" x="3.9" y="5" width="3.2" height="6" rx="0.9" fill="currentColor" opacity="0.55" />
              </svg>
            </button>
            <span class="titlebar-path" id="titlebar-path"></span>
            <div class="titlebar-tools">
              <div class="canvas-zoom">
                <button class="canvas-zoom-btn" id="canvas-zoom-out" type="button" title="缩小" aria-label="缩小">
                  −
                </button>
                <input
                  class="canvas-zoom-value"
                  id="canvas-zoom-value"
                  type="text"
                  value="100%"
                  inputmode="decimal"
                  spellcheck="false"
                  autocomplete="off"
                  title="输入缩放比例后回车生效（25%–400%）· Ctrl+0 重置为 100%"
                  aria-label="缩放比例"
                />
                <button class="canvas-zoom-btn" id="canvas-zoom-in" type="button" title="放大" aria-label="放大">
                  +
                </button>
              </div>

              <div class="canvas-tools" id="canvas-tools">
                <button
                  class="canvas-tool canvas-tool-tools"
                  id="canvas-tool-menu"
                  type="button"
                  title="工具"
                  aria-label="工具"
                  aria-haspopup="menu"
                >
                  <span class="canvas-tool-icon" id="canvas-tool-icon">
                    <svg viewBox="0 0 20 20" width="17" height="17" aria-hidden="true">
                      <path
                        d="M3.2 7.4h13.6v8a1.4 1.4 0 0 1-1.4 1.4H4.6a1.4 1.4 0 0 1-1.4-1.4z"
                        stroke="currentColor"
                        stroke-width="1.3"
                        fill="none"
                        stroke-linejoin="round"
                      />
                      <path
                        d="M7.2 7.4V6a1.8 1.8 0 0 1 1.8-1.8h2a1.8 1.8 0 0 1 1.8 1.8v1.4"
                        stroke="currentColor"
                        stroke-width="1.3"
                        fill="none"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      />
                      <path d="M3.2 11h13.6" stroke="currentColor" stroke-width="1.3" fill="none" />
                    </svg>
                  </span>
                </button>
              </div>

              <div class="canvas-actions">
                <button
                  class="canvas-act"
                  id="canvas-export"
                  type="button"
                  title="导出：图片、PDF 或可拖动的网页"
                  aria-label="导出"
                  aria-haspopup="true"
                >
                  <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
                    <path
                      d="M10 3.4v8.2M6.8 8.4 10 11.6l3.2-3.2"
                      stroke="currentColor"
                      stroke-width="1.5"
                      fill="none"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    />
                    <path
                      d="M4 14.2v1.4a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-1.4"
                      stroke="currentColor"
                      stroke-width="1.5"
                      fill="none"
                      stroke-linecap="round"
                    />
                  </svg>
                </button>
              </div>
            </div>
            <div class="titlebar-right">
              <button
                id="settings-btn"
                class="caption"
                type="button"
                title="设置"
                aria-label="设置"
              >
                <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
                  <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5" fill="none" />
                  <path
                    d="M10.18 5.86L10.48 2.93L13.52 2.93L13.82 5.86L15.05 6.38L17.34 4.51L19.49 6.66L17.62 8.95L18.14 10.18L21.07 10.48L21.07 13.52L18.14 13.82L17.62 15.05L19.49 17.34L17.34 19.49L15.05 17.62L13.82 18.14L13.52 21.07L10.48 21.07L10.18 18.14L8.95 17.62L6.66 19.49L4.51 17.34L6.38 15.05L5.86 13.82L2.93 13.52L2.93 10.48L5.86 10.18L6.38 8.95L4.51 6.66L6.66 4.51L8.95 6.38z"
                    stroke="currentColor"
                    stroke-width="1.5"
                    fill="none"
                    stroke-linejoin="round"
                    stroke-linecap="round"
                  />
                </svg>
              </button>

              <button
                id="win-min"
                class="caption"
                type="button"
                title="最小化"
                aria-label="最小化"
              >
                <svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true">
                  <path d="M2 6h8" stroke="currentColor" stroke-width="1" fill="none" />
                </svg>
              </button>

              <button
                id="win-max"
                class="caption"
                type="button"
                title="最大化/还原"
                aria-label="最大化"
              >
                <svg
                  class="icon-maximize"
                  viewBox="0 0 12 12"
                  width="12"
                  height="12"
                  aria-hidden="true"
                >
                  <rect
                    x="2.5"
                    y="2.5"
                    width="7"
                    height="7"
                    rx="1"
                    stroke="currentColor"
                    stroke-width="1"
                    fill="none"
                  />
                </svg>
                <svg
                  class="icon-restore"
                  viewBox="0 0 12 12"
                  width="12"
                  height="12"
                  aria-hidden="true"
                >
                  <path
                    d="M3.5 4.5h6v5h-6zM4.5 4.5v-1h5v5"
                    stroke="currentColor"
                    stroke-width="1"
                    fill="none"
                  />
                </svg>
              </button>

              <button
                id="win-close"
                class="caption caption-close"
                type="button"
                title="关闭"
                aria-label="关闭"
              >
                <svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true">
                  <path
                    d="M2.5 2.5l7 7M9.5 2.5l-7 7"
                    stroke="currentColor"
                    stroke-width="1"
                    fill="none"
                  />
                </svg>
              </button>
            </div>
          </header>
          <div class="canvas-content">
            <button
              class="assistant-float-toggle"
              id="assistant-toggle"
              type="button"
              title="打开 AI 助手"
              aria-label="打开 AI 助手"
              aria-expanded="false"
            >
              <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
                <rect x="2" y="3.2" width="12" height="9.6" rx="1.8" stroke="currentColor" stroke-width="1.4" fill="none" />
                <rect class="titlebar-side-bar" x="10.1" y="5" width="3.2" height="6" rx="0.9" fill="currentColor" opacity="0.55" />
              </svg>
            </button>
        <!-- 搜索：Ctrl+F 唤出，搜这个画布的块，也搜 Markdown 卡片里的正文 -->
        <div class="canvas-search" id="canvas-search" hidden>
          <div class="canvas-search-field">
            <svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true">
              <circle cx="9" cy="9" r="5.2" stroke="currentColor" stroke-width="1.5" fill="none" />
              <path d="M12.9 12.9 17 17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            </svg>
            <input
              class="canvas-search-input"
              id="canvas-search-input"
              type="text"
              placeholder="搜索这个画布的块、正文…"
              spellcheck="false"
              autocomplete="off"
              aria-label="搜索"
            />
            <span class="canvas-search-count" id="canvas-search-count"></span>
          </div>
          <div class="canvas-search-results" id="canvas-search-results"></div>
        </div>

        <div class="canvas-stage" id="canvas-stage">
          <canvas class="canvas-backdrop" id="canvas-cosmos" hidden aria-hidden="true"></canvas>
          <!-- 固定宽度时画白页/灰底：视口大小的渐变层，pointer-events:none 不吃事件，
               夹在星空底和连线层之间，既不遮连线也不挡块的命中 -->
          <div class="canvas-page-shade" id="canvas-page-shade" hidden aria-hidden="true"></div>
          <svg class="canvas-edge-layer" id="canvas-edge-layer" aria-hidden="true">
            <g id="canvas-edge-transform"></g>
          </svg>
          <div class="canvas-world" id="canvas-world"></div>
          <div class="canvas-endpoint-layer" id="canvas-endpoint-layer"></div>
          <div class="canvas-guide-layer" id="canvas-guide-layer" aria-hidden="true"></div>
          <div class="canvas-measure-layer" id="canvas-measure-layer" aria-hidden="true"></div>
          <div class="canvas-port-visual-layer" id="canvas-port-visual-layer" aria-hidden="true"></div>
          <div class="canvas-handle-visual-layer" id="canvas-handle-visual-layer" aria-hidden="true"></div>

          <!-- 鸟瞰窗：右下角整个画布的缩小版，拖亮框或点框外就把视野带到那儿 -->
          <div class="canvas-minimap" id="canvas-minimap">
            <canvas class="canvas-minimap-canvas" id="canvas-minimap-canvas"></canvas>
            <span class="canvas-minimap-count" id="canvas-minimap-count" aria-label="画布上的面板数量">0</span>
            <button
              class="canvas-minimap-min"
              id="canvas-minimap-min"
              type="button"
              title="收起鸟瞰窗"
              aria-label="收起鸟瞰窗"
            >
              −
            </button>
          </div>
          <button
            class="canvas-minimap-key"
            id="canvas-minimap-key"
            type="button"
            title="显示鸟瞰窗"
            aria-label="显示鸟瞰窗"
            hidden
          >
            <svg viewBox="0 0 20 20" width="17" height="17" aria-hidden="true">
              <rect x="2.5" y="3.5" width="15" height="13" rx="2" stroke="currentColor" stroke-width="1.3" fill="none" />
              <rect x="6" y="7" width="8" height="6" rx="1" fill="currentColor" opacity="0.55" />
            </svg>
          </button>

          <div class="canvas-copy" id="canvas-video-copy" hidden>
            <p class="canvas-copy-name" id="canvas-copy-name"></p>
            <div class="canvas-copy-bar"><i class="canvas-copy-fill" id="canvas-copy-fill"></i></div>
            <div class="canvas-copy-foot">
              <span class="canvas-copy-text" id="canvas-copy-text"></span>
              <button class="canvas-copy-cancel" id="canvas-copy-cancel" type="button">停止</button>
            </div>
          </div>
        </div>

        <p class="canvas-error" id="canvas-error" hidden></p>
          </div>
        </div>

        <aside class="assistant-panel" id="assistant-panel" aria-label="AI 助手" hidden>
          <!-- deep：标题、模型名这些子元素上按住也能拖窗口；里面的按钮会自动挡住拖动 -->
          <header class="assistant-head" data-tauri-drag-region="deep">
            <div class="assistant-title">
              <span>AI 助手</span>
              <span class="assistant-model" id="assistant-model"></span>
            </div>
            <div class="assistant-actions">
              <button class="assistant-act" id="assistant-new" type="button" title="新会话" aria-label="新会话">＋</button>
              <button class="assistant-act" id="assistant-close" type="button" title="收起助手" aria-label="收起助手">×</button>
            </div>
          </header>
          <div class="assistant-chats">
            <select class="assistant-chat-select" id="assistant-chat-select" aria-label="会话"></select>
            <button class="assistant-chat-del" id="assistant-chat-del" type="button" title="删除这个会话" aria-label="删除这个会话">删除</button>
          </div>
          <div class="assistant-status" id="assistant-status" hidden></div>
          <div class="assistant-messages" id="assistant-messages"></div>
          <form class="assistant-compose" id="assistant-form">
            <div class="assistant-compose-resize" id="assistant-compose-resize" aria-hidden="true"></div>
            <div class="assistant-attachments" id="assistant-attachments" hidden></div>
            <textarea
              class="assistant-input"
              id="assistant-input"
              rows="3"
              placeholder="说说要做什么，比如：用当前画布做一个公众号文章模板"
              spellcheck="false"
              aria-label="给 AI 助手的消息"
            ></textarea>
            <div class="assistant-compose-bar">
              <span class="assistant-context" id="assistant-context"></span>
              <button class="assistant-attach" id="assistant-attach" type="button" title="添加图片" aria-label="添加图片" hidden>图片</button>
              <input class="assistant-file" id="assistant-file" type="file" accept="image/*" multiple hidden />
              <button class="assistant-stop" id="assistant-stop" type="button" hidden>停止</button>
              <button class="assistant-send" id="assistant-send" type="submit">发送</button>
            </div>
          </form>
          <div class="assistant-resize" id="assistant-resize" aria-hidden="true"></div>
        </aside>
      </section>

    </div>

    <div id="ctx-menu" class="ctx-menu" hidden></div>
  </body>
</html>
