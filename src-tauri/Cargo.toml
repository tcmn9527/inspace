[package]
name = "inspace"
version = "0.1.0"
description = "无限画布：一块装得下笔记、文件和媒体的桌面空间"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "inspace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# 关掉就没 CUDA，纯 CPU 也能出图（慢一个数量级）。开发机一律默认开。
default = ["cuda"]
cuda = []

[build-dependencies]
tauri-build = { version = "2", features = [] }
# 生图引擎的 C++ 侧：CMake 现编上游源码，bindgen 现场生成绑定
cmake = "0.1"
bindgen = "0.71"

[dependencies]
# protocol-asset：把磁盘上的视频变成 <video> 能按 Range 读的地址，
# 20GB 的片子也只占几十 MB 解码缓冲，不用把整份读进内存。
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# 应用只该有一个实例：MCP 端口、数据写入都只能有一个主人
tauri-plugin-single-instance = "2"
# MCP 走本机 Streamable HTTP，协议层只用到 POST 一条路由
axum = "0.8"
tokio = { version = "1", features = ["net", "time", "sync"] }
# 空间这边已经不直接开文件了，这条留着只为把 shellexecute-on-windows 这个 feature
# 钉在依赖树上：opener 插件也用它，关掉的话它会去拉一个 powershell.exe 子进程。
open = { version = "5", features = ["shellexecute-on-windows"] }
# 8K 贴图要在应用里自己下：贴图站不给跨域头，前端 fetch 被挡，只能从这条线走。
# 只开 tls，用内置的根证书，不跟系统证书库和解压库较劲。
ureq = { version = "2", default-features = false, features = ["tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 图片粘贴：前端传 base64，这里解码落盘
base64 = "0.22"
# epub 是 zip：只用到 raw deflate，flate2 本来就在依赖树里
flate2 = "1"
# epub/mobi 的 OPF、NCX 是 XML，用流式读，坏一两个标签也不至于整本打不开
quick-xml = "0.42"
# bundled：自带 SQLite 源码，不依赖系统 SQLite。
# 关掉默认特性（cache/hashlink/wasm 等），只留用得到的那部分。
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
# 生图面板的引擎：不用 crates.io 的 diffusion-rs（它封的源码载不动 Qwen-Image 2.1 权重），
# 源码由 scripts/prepare-sdcpp.mjs 取到 tools/sdcpp，build.rs 现场编成静态库链进来。
# cuda 特性关掉就是纯 CPU。
# 只开 png：出图和逐步预览都要把 RGBA 编成 PNG 推给前端。
image = { version = "0.25", default-features = false, features = ["png"] }
# 落图抓屏：直接读窗口客户区像素，屏幕上 ClearType 渲染的文本才和原面板完全一致。
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Storage_Xps",
  "Win32_UI_WindowsAndMessaging",
] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# F10 是 WebView2 的保留加速键，页面收不到 keydown；只有直接从 WebView2 控制器上
# 接 AcceleratorKeyPressed，才能既保留其它浏览器快捷键、又拿到 F10。
[target."cfg(windows)".dependencies]
webview2-com = "0.39"
